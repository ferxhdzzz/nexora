        <form id="formularioContacto">
  <h2>Formulario de Contacto</h2>
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" 
            class="form-control" 
            id="nombre"
            name="name"
             placeholder="Ingrese su nombre" required>
          </div>
          <div class="mb-3">
            <label for="correo" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="correo" name="email" placeholder="nombre@ejemplo.com" required>
          </div>
          <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje de Retroalimentación</label>
            <textarea class="form-control" id="mensaje" rows="5" name="message" placeholder="Ingrese su mensaje" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary" id="enviarBtn">Enviar</button>
        </form>
      </div> 
    </div>
